name: Build Windows (Vulkan core)

permissions:
  contents: read
  pull-requests: read

on:
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""
        description: "Git ref to checkout (branch, tag, or SHA). Leaves empty for default."
  workflow_dispatch:

jobs:
  build-windows:
    name: ${{ matrix.game.id }} x64 Vulkan
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game:
          - id: generalsxzh
            name: Zero Hour
            target: z_generals
            folder: GeneralsMD
            build_zh: "ON"
            build_generals: "OFF"
            artifact_name: windows-x64-GeneralsXZH.zip
            ci_artifact_name: windows-x64-GeneralsXZH-ci-only.zip
          - id: generalsx
            name: Generals Base
            target: g_generals
            folder: Generals
            build_zh: "OFF"
            build_generals: "ON"
            artifact_name: windows-x64-GeneralsX.zip
            ci_artifact_name: windows-x64-GeneralsX-ci-only.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (win64vk only)
        shell: pwsh
        env:
          NGMP_DEFAULT_HOST: ${{ secrets.NGMP_DEFAULT_HOST }}
          NGMP_SERVER_HOST: ${{ secrets.NGMP_DEFAULT_HOST }}
          NGMP_SERVER_PORT: ${{ secrets.NGMP_SERVER_PORT }}
          NGMP_USE_SSL: ${{ secrets.NGMP_USE_SSL }}
          NGMP_WEB_PORTAL_URL: ${{ secrets.NGMP_WEB_PORTAL_URL }}
          NGMP_MOTD_URL: ${{ secrets.NGMP_MOTD_URL }}
        run: |
          cmake --preset win64vk `
            -DRTS_BUILD_GENERALS=${{ matrix.game.build_generals }} `
            -DRTS_BUILD_ZEROHOUR=${{ matrix.game.build_zh }} `
            -DRTS_BUILD_CORE_TOOLS=OFF `
            -DRTS_BUILD_ZEROHOUR_TOOLS=OFF `
            -DRTS_BUILD_GENERALS_TOOLS=OFF `
            -DRTS_BUILD_OPTION_SAGE_PATCH=OFF `
            -DSAGE_USE_DETERMINISTIC_MATH=ON
          $cache = Get-Content build/win64vk/CMakeCache.txt -Raw
          if ($cache -notmatch 'SAGE_USE_VULKAN_CORE:BOOL=ON') {
            throw 'REFUSING BUILD: win64vk cache is not Vulkan-core.'
          }

      - name: Build
        shell: pwsh
        run: cmake --build build/win64vk --config Release --target ${{ matrix.game.target }}

      - name: Collect runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null

          $outDir = "build/win64vk/${{ matrix.game.folder }}/Release"
          $exe = Join-Path $outDir 'GeneralRefresh.exe'
          $pdb = Join-Path $outDir 'GeneralRefresh.pdb'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Missing exe: $exe" }
          Copy-Item $exe artifacts/
          Copy-Item $exe ci-artifacts/
          if (Test-Path -LiteralPath $pdb) {
            Copy-Item $pdb artifacts/
            Copy-Item $pdb ci-artifacts/
          }

          if (Test-Path "assets/fonts") {
            if (-not (Test-Path "assets/fonts/LICENSE.liberation") -or -not (Test-Path "assets/fonts/LICENSE.fontawesome")) {
              throw "Missing required font license files in assets/fonts"
            }
            New-Item -ItemType Directory -Force artifacts/fonts | Out-Null
            Copy-Item assets/fonts/* artifacts/fonts/
            New-Item -ItemType Directory -Force ci-artifacts/fonts | Out-Null
            Copy-Item assets/fonts/* ci-artifacts/fonts/
          }

          # x64 Desktop Release CRT
          $vcReleaseDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -Recurse |
            Where-Object { $_.FullName -match "\\x64\\" -and $_.FullName -match "Microsoft\.VC143\.CRT$" -and $_.FullName -notmatch "onecore" } |
            Select-Object -First 1
          if ($vcReleaseDir) {
            Get-ChildItem -Path (Join-Path $vcReleaseDir.FullName "*.dll") | ForEach-Object {
              Copy-Item $_.FullName artifacts/
              Copy-Item $_.FullName ci-artifacts/
            }
          }

          @"
          Copy these files into an existing licensed ${{ matrix.game.name }} installation.
          This is the pure Vulkan x64 build. Supply DXVK x64 d3d8.dll/d3d9.dll/dxgi.dll
          (dist/dxvk-x64 in the workspace) next to GeneralRefresh.exe.
          "@ | Set-Content artifacts/INSTALL.txt
          Compress-Archive -Path artifacts/* -DestinationPath "${{ matrix.game.artifact_name }}"
          Compress-Archive -Path ci-artifacts/* -DestinationPath "${{ matrix.game.ci_artifact_name }}"

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game.artifact_name }}
          path: ${{ matrix.game.artifact_name }}
          archive: false
          retention-days: 7

      - name: Upload replay-test runtime
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.game.ci_artifact_name }}
          path: ${{ matrix.game.ci_artifact_name }}
          archive: false
          retention-days: 1
